name: Tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test fresh-user and workbench flows (no provider keys)
        run: npm run test:browser
      - name: Install Snack Abduction demo
        run: npm --prefix demos/snack-abduction ci
      - name: Test Snack Abduction gameplay
        working-directory: demos/snack-abduction
        run: npm test
      - name: Build Snack Abduction demo
        working-directory: demos/snack-abduction
        run: npm run build
      - name: Test Snack Abduction browser flows
        working-directory: demos/snack-abduction
        run: npm run test:browser
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            demos/snack-abduction/playwright-report/
            demos/snack-abduction/test-results/
          retention-days: 7
          if-no-files-found: ignore
