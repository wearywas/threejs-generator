name: Tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.project.name }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.project.id == 'generator' && 15 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project:
          - name: Generator
            id: generator
            directory: .
            browserMinutes: 8
          - name: Snack Abduction
            id: snack-abduction
            directory: demos/snack-abduction
            browserMinutes: 10
          - name: Little Borough
            id: little-borough
            directory: demos/little-borough
            browserMinutes: 13
    defaults:
      run:
        working-directory: ${{ matrix.project.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps --no-shell chromium
      # Leave time to upload diagnostics even if the browser stops responding.
      - name: Test browser flows (no provider keys)
        timeout-minutes: ${{ matrix.project.browserMinutes }}
        run: npm run test:browser
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.project.id }}-${{ matrix.os }}
          path: |
            ${{ matrix.project.directory }}/playwright-report/
            ${{ matrix.project.directory }}/test-results/
          retention-days: 7
          if-no-files-found: ignore
          # Interrupted runs may leave their trace in .playwright-artifacts-*.
          # Paths above are restricted to test output, never the project root.
          include-hidden-files: true
